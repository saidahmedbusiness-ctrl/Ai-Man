<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080a12" />
      <stop offset="55%" stop-color="#131c38" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="warmWindow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="poolReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#080a12" stop-opacity="0.95" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)" />
  <!-- Horizon Glow -->
  <ellipse cx="450" cy="340" rx="340" ry="70" fill="#4D7CFE" opacity="0.22" />
  <!-- Architectural Modern Villa & Cantilever -->
  <g>
    <!-- Back Tower -->
    <rect x="470" y="130" width="140" height="210" fill="#0f1526" stroke="#4D7CFE" stroke-opacity="0.4" stroke-width="1.5" />
    <!-- Warm Interior Lit Floors -->
    <rect x="190" y="195" width="350" height="65" fill="#161f38" stroke="#F5F7FF" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="210" y="205" width="290" height="45" fill="url(#warmWindow)" />
    <!-- Lower Ground Volume -->
    <rect x="240" y="260" width="340" height="80" fill="#0c101d" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />
    <rect x="270" y="272" width="180" height="56" fill="url(#warmWindow)" opacity="0.8" />
    <!-- Architectural Columns -->
    <line x1="215" y1="260" x2="215" y2="340" stroke="#F5F7FF" stroke-width="3" opacity="0.7" />
    <line x1="360" y1="205" x2="360" y2="250" stroke="#161f38" stroke-width="4" />
  </g>
  <!-- Infinity Pool Foreground -->
  <polygon points="120,340 680,340 760,450 40,450" fill="url(#poolReflect)" stroke="#4D7CFE" stroke-opacity="0.4" stroke-width="1.5" />
  <!-- Water Ripples -->
  <line x1="240" y1="370" x2="480" y2="370" stroke="#fde68a" stroke-opacity="0.35" stroke-width="2" />
  <line x1="200" y1="395" x2="540" y2="395" stroke="#4D7CFE" stroke-opacity="0.4" stroke-width="1.5" />
  <text x="60" y="65" fill="#A4AAC0" font-family="sans-serif" font-size="12" letter-spacing="2">ARCHITECTURAL FILM // DRONE AI</text>
</svg>