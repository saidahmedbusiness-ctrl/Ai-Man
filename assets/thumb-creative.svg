<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#4D7CFE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#080a12" />
    </radialGradient>
    <filter id="cinemaBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="#080a12" />
  <circle cx="400" cy="240" r="260" fill="url(#portalGlow)" />
  <!-- Glowing Sci-Fi Monolith Portal -->
  <circle cx="400" cy="225" r="105" fill="none" stroke="#F5F7FF" stroke-width="4" filter="url(#cinemaBlur)" />
  <circle cx="400" cy="225" r="135" fill="none" stroke="#4D7CFE" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="12 8" />
  <!-- Surreal Desert / Obsidian Cliffs -->
  <polygon points="0,420 260,310 350,365 0,500" fill="#0d1120" />
  <polygon points="800,410 530,305 450,365 800,500" fill="#0d1120" />
  <polygon points="180,500 400,355 620,500" fill="#14192e" stroke="#8B5CF6" stroke-opacity="0.35" />
  <!-- Lone Traveler Silhouette -->
  <circle cx="400" cy="322" r="6" fill="#F5F7FF" />
  <path d="M391 355 L395 330 L405 330 L409 355 Z" fill="#080a12" stroke="#F5F7FF" stroke-width="1.2" />
  <text x="60" y="65" fill="#A4AAC0" font-family="sans-serif" font-size="12" letter-spacing="2">IMAGINATIVE CINEMA // AI FILM</text>
</svg>