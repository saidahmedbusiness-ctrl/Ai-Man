<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a1c12" />
      <stop offset="50%" stop-color="#140d18" />
      <stop offset="100%" stop-color="#080a12" />
    </radialGradient>
    <linearGradient id="bunTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7CFE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bgGlow)" />
  <!-- Studio Volumetric Lights -->
  <ellipse cx="220" cy="120" rx="180" ry="90" fill="#4D7CFE" opacity="0.18" filter="url(#glow)" transform="rotate(-25 220 120)" />
  <ellipse cx="580" cy="140" rx="190" ry="80" fill="#f97316" opacity="0.22" filter="url(#glow)" transform="rotate(25 580 140)" />
  <!-- Cinematic Grid Floor -->
  <path d="M0 400 L800 400 M100 400 L20 500 M250 400 L200 500 M400 400 L400 500 M550 400 L600 500 M700 400 L780 500" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" />
  <!-- Floating Bokeh / Ember Sparks -->
  <g fill="#fbbf24" opacity="0.75">
    <circle cx="240" cy="190" r="3" />
    <circle cx="560" cy="170" r="4" />
    <circle cx="590" cy="260" r="2.5" />
    <circle cx="200" cy="290" r="3.5" />
    <circle cx="310" cy="130" r="2" />
    <circle cx="490" cy="115" r="3" />
  </g>
  <g fill="#4D7CFE" opacity="0.65">
    <circle cx="170" cy="220" r="3.5" />
    <circle cx="630" cy="210" r="2.5" />
    <circle cx="270" cy="350" r="2" />
  </g>
  <!-- Stylized High-Speed Hero Burger Subject -->
  <g transform="translate(0, 10)">
    <!-- Shadow -->
    <ellipse cx="400" cy="385" rx="150" ry="22" fill="#000000" opacity="0.7" filter="url(#glow)" />
    <!-- Bottom Bun -->
    <path d="M270 330 Q400 355 530 330 L515 362 Q400 382 285 362 Z" fill="url(#bunTop)" />
    <!-- Patty with Neon Rim Light -->
    <rect x="255" y="282" width="290" height="44" rx="22" fill="#3b190b" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Melted Cheese Layer -->
    <path d="M260 282 L540 282 L525 295 L490 286 L455 312 L420 286 L360 315 L325 288 L275 302 Z" fill="url(#cheese)" />
    <!-- Tomato & Greens -->
    <rect x="275" y="258" width="250" height="16" rx="8" fill="#dc2626" />
    <path d="M250 255 Q290 240 330 258 Q370 272 410 254 Q450 238 490 258 Q525 270 550 252" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" />
    <!-- Top Crown Bun -->
    <path d="M265 242 C265 145, 535 145, 535 242 Z" fill="url(#bunTop)" />
    <path d="M265 242 C265 145, 535 145, 535 242" fill="none" stroke="url(#neonRim)" stroke-width="4" />
    <!-- Sesame Seeds -->
    <g fill="#fde68a" opacity="0.85">
      <ellipse cx="360" cy="190" rx="5" ry="2.5" transform="rotate(-15 360 190)" />
      <ellipse cx="405" cy="182" rx="5" ry="2.5" transform="rotate(8 405 182)" />
      <ellipse cx="450" cy="195" rx="5" ry="2.5" transform="rotate(22 450 195)" />
      <ellipse cx="335" cy="212" rx="5" ry="2.5" transform="rotate(-25 335 212)" />
      <ellipse cx="425" cy="210" rx="5" ry="2.5" transform="rotate(-8 425 210)" />
      <ellipse cx="480" cy="216" rx="5" ry="2.5" transform="rotate(18 480 216)" />
    </g>
  </g>
  <!-- HUD Frame Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <path d="M40 60 L40 40 L60 40" />
    <path d="M760 60 L760 40 L740 40" />
    <path d="M40 440 L40 460 L60 460" />
    <path d="M760 440 L760 460 L740 460" />
  </g>
  <text x="60" y="65" fill="#A4AAC0" font-family="sans-serif" font-size="12" letter-spacing="2">AI FOOD STUDIO // 120FPS MACRO</text>
</svg>