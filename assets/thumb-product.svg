<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="prodBg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#27173a" />
      <stop offset="55%" stop-color="#0f1222" />
      <stop offset="100%" stop-color="#080a12" />
    </radialGradient>
    <linearGradient id="glassBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#111526" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#4D7CFE" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="luxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#prodBg)" />
  <!-- Luxury Light Streaks -->
  <path d="M120 380 Q400 120 680 280" fill="none" stroke="#8B5CF6" stroke-width="6" opacity="0.35" filter="url(#luxGlow)" />
  <path d="M150 240 Q400 390 650 160" fill="none" stroke="#4D7CFE" stroke-width="4" opacity="0.35" filter="url(#luxGlow)" />
  <!-- Reflective Podium -->
  <ellipse cx="400" cy="395" rx="175" ry="26" fill="#171c33" stroke="#4D7CFE" stroke-opacity="0.5" stroke-width="1.5" />
  <ellipse cx="400" cy="402" rx="145" ry="16" fill="#8B5CF6" opacity="0.18" filter="url(#luxGlow)" />
  <!-- Luxury Perfume Bottle -->
  <g transform="translate(0, -8)">
    <!-- Bottle Body -->
    <rect x="330" y="195" width="140" height="190" rx="18" fill="url(#glassBottle)" stroke="#F5F7FF" stroke-opacity="0.6" stroke-width="2" />
    <!-- Inner Liquid Glow -->
    <rect x="344" y="230" width="112" height="142" rx="10" fill="#8B5CF6" opacity="0.35" />
    <!-- Center Brand Plaque -->
    <rect x="362" y="255" width="76" height="82" rx="4" fill="#080A12" stroke="url(#goldCap)" stroke-width="1.5" />
    <text x="400" y="295" text-anchor="middle" fill="#F5F7FF" font-family="sans-serif" font-weight="bold" font-size="14" letter-spacing="3">AI</text>
    <text x="400" y="315" text-anchor="middle" fill="#fde68a" font-family="sans-serif" font-size="9" letter-spacing="2">LUXE</text>
    <!-- Bottle Neck & Cap -->
    <rect x="380" y="170" width="40" height="25" fill="url(#goldCap)" />
    <polygon points="360,170 440,170 425,130 375,130" fill="#1e293b" stroke="url(#goldCap)" stroke-width="2" />
  </g>
  <text x="60" y="65" fill="#A4AAC0" font-family="sans-serif" font-size="12" letter-spacing="2">PRODUCT COMMERCIAL // CGI &amp; AI</text>
</svg>